<!doctype html><meta charset="utf-8">
<style>
  @font-face{font-family:"Instrument Serif";src:url("../assets/fonts/instrument-serif-latin.woff2") format("woff2");font-weight:400}
  @font-face{font-family:"Instrument Serif";src:url("../assets/fonts/instrument-serif-italic-latin.woff2") format("woff2");font-weight:400;font-style:italic}
  @font-face{font-family:"Manrope";src:url("../assets/fonts/manrope-latin.woff2") format("woff2");font-weight:400 800}
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#0A0A0B;color:#F3EBDD;display:grid;
       grid-template-columns:1fr 470px;font-family:"Manrope",sans-serif;overflow:hidden;position:relative}
  .copy{padding:82px 34px 74px 74px;display:flex;flex-direction:column;justify-content:center;position:relative;z-index:2}
  .eyebrow{font-size:14px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#F5A13A;margin-bottom:30px}
  h1{font-family:"Instrument Serif",serif;font-size:92px;line-height:.94;letter-spacing:-.03em;font-weight:400}
  h1 em{font-style:italic}
  .role{margin-top:28px;font-size:24px;font-weight:600}
  .sub{margin-top:10px;font-size:18px;color:#C9BDB0;line-height:1.45;max-width:32ch}
  .rule{margin-top:34px;width:82px;height:3px;background:#E94516}
  .shot{position:relative;overflow:hidden}
  .shot img{width:100%;height:100%;object-fit:cover;object-position:52% 30%}
  .shot::after{content:"";position:absolute;inset:0;
    background:linear-gradient(to left,rgba(10,10,11,0) 34%,rgba(10,10,11,.98) 100%),
               radial-gradient(90% 100% at 100% 40%,rgba(40,16,10,0) 40%,rgba(40,16,10,.5) 100%)}
</style>
<div class="copy">
  <span class="eyebrow">Dubai, UAE</span>
  <h1>Khalid<br><em>Ounzar</em></h1>
  <p class="role">Performance Marketer — Media Buyer</p>
  <p class="sub">Meta Ads for e-commerce and cash on delivery. Reported campaign figures, shown honestly.</p>
  <span class="rule"></span>
</div>
<div class="shot"><img src="../assets/cinematic/s1-intro-poster.jpg" alt=""></div>
