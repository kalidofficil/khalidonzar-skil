<!doctype html>
<!-- Source for the 1200x630 social card. After editing, regenerate with:
     python3 scripts/make-og-cover.py                                    -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,700&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #F7F5F0; color: #16211C;
    font-family: "Fraunces", Georgia, serif;
    padding: 64px 80px 72px; position: relative;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .row { display: flex; align-items: center; gap: 18px; }
  .mark { display: flex; align-items: flex-end; gap: 5px; height: 34px; }
  .mark i { display: block; width: 9px; background: #1A3A2E; border-radius: 2px; }
  .mark i:nth-child(1) { height: 14px; }
  .mark i:nth-child(2) { height: 23px; }
  .mark i:nth-child(3) { height: 34px; background: #0B8757; }
  .name { font-size: 26px; font-weight: 600; font-variation-settings: "opsz" 24; }
  .label {
    font-family: "Chivo Mono", monospace; font-size: 12px; font-weight: 500;
    letter-spacing: 0.2em; text-transform: uppercase; color: #626E67;
  }
  h1 {
    font-size: 76px; font-weight: 600; line-height: 1.05;
    font-variation-settings: "opsz" 144;
    letter-spacing: -0.022em; max-width: 17ch;
  }
  h1 em { font-style: italic; font-weight: 700; color: #1A3A2E; }
  .stats { display: flex; gap: 64px; padding-top: 30px; border-top: 1px solid rgba(22,33,28,0.16); }
  .stat b {
    display: block; font-size: 34px; font-weight: 600; line-height: 1.15;
    font-variation-settings: "opsz" 96; letter-spacing: -0.02em; color: #1A3A2E;
  }
  .stat span {
    display: block; margin-top: 6px; line-height: 1.2;
    font-family: "Chivo Mono", monospace; font-size: 12px; letter-spacing: 0.14em;
    text-transform: uppercase; color: #626E67;
  }
</style>
</head>
<body>
  <div class="row">
    <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="name">Khalid Onzar</span>
    <span class="label">White-label paid media</span>
  </div>

  <h1>I run your paid accounts. Your client <em>never hears my name</em>.</h1>

  <div class="stats">
    <div class="stat"><b>$8.4M</b><span>Spend managed</span></div>
    <div class="stat"><b>4.1&times;</b><span>Blended ROAS</span></div>
    <div class="stat"><b>96%</b><span>Client retention</span></div>
  </div>
</body>
</html>
