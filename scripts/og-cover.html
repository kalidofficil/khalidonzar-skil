<!doctype html><meta charset="utf-8">
<style>
  @font-face{font-family:"Fraunces";src:url("../assets/fonts/fraunces-latin.woff2") format("woff2");font-weight:300 700}
  @font-face{font-family:"Public Sans";src:url("../assets/fonts/publicsans-latin.woff2") format("woff2");font-weight:400 700}
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#0A0F16;color:#EDF1F5;display:grid;
       grid-template-columns:440px 1fr;font-family:"Public Sans",sans-serif;overflow:hidden}

  .shot img{width:100%;height:100%;object-fit:cover;object-position:50% 22%}

    background:linear-gradient(to right,rgba(10,15,22,0) 55%,rgba(10,15,22,.96) 100%)}
  .copy{padding:76px 76px 68px 56px;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font-family:ui-monospace,monospace;font-size:15px;letter-spacing:.19em;
           text-transform:uppercase;color:#E0A052;margin-bottom:26px}
  h1{font-family:"Fraunces",serif;font-size:80px;line-height:1;letter-spacing:-.035em;font-weight:300}
  h1 b{font-weight:600}
  .role{margin-top:24px;font-size:25px;color:#EDF1F5;font-weight:500}
  .sub{margin-top:9px;font-size:19px;color:#9BA9B6;line-height:1.45;max-width:30ch}
  .rule{margin-top:36px;width:76px;height:2px;background:#E0A052}
</style>
<div class="shot"><img src="../assets/cinematic/s01-intro-poster.jpg" alt=""></div>

  <p class="role">Performance Marketer — Media Buyer</p>
